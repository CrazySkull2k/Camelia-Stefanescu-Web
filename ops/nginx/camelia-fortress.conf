upstream camelia_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

limit_req_zone $binary_remote_addr zone=camelia_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=camelia_lookup:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=camelia_admin:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name public.example.com account.example.com admin.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name public.example.com;

    ssl_certificate /etc/letsencrypt/live/public.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/public.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 8m;
    client_body_timeout 15s;
    keepalive_timeout 20s;
    send_timeout 15s;

    location = /api/auth/login {
        limit_req zone=camelia_auth burst=5 nodelay;
        include /etc/nginx/snippets/camelia-next-proxy.conf;
    }

    location = /api/auth/register {
        limit_req zone=camelia_auth burst=5 nodelay;
        include /etc/nginx/snippets/camelia-next-proxy.conf;
    }

    location = /api/appointments/lookup {
        limit_req zone=camelia_lookup burst=10 nodelay;
        include /etc/nginx/snippets/camelia-next-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/camelia-next-proxy.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name account.example.com;

    ssl_certificate /etc/letsencrypt/live/account.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/account.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "private, no-store" always;

    client_max_body_size 20m;
    client_body_timeout 20s;
    keepalive_timeout 20s;
    send_timeout 20s;

    location ^~ /api/account/ {
        limit_req zone=camelia_lookup burst=20 nodelay;
        include /etc/nginx/snippets/camelia-next-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/camelia-next-proxy.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;

    ssl_certificate /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "private, no-store" always;

    client_max_body_size 20m;
    client_body_timeout 20s;
    keepalive_timeout 20s;
    send_timeout 20s;

    location ^~ /api/admin/ {
        limit_req zone=camelia_admin burst=15 nodelay;
        include /etc/nginx/snippets/camelia-next-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/camelia-next-proxy.conf;
    }
}
